<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#047857" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Squircle Background -->
  <rect x="4" y="4" width="92" height="92" rx="26" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="3" filter="url(#glow)"/>
  
  <!-- Sun Rays & Sun -->
  <g stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round" opacity="0.9">
    <line x1="50" y1="18" x2="50" y2="13" />
    <line x1="38" y1="22" x2="34" y2="18" />
    <line x1="62" y1="22" x2="66" y2="18" />
    <line x1="28" y1="30" x2="23" y2="28" />
    <line x1="72" y1="30" x2="77" y2="28" />
  </g>
  <circle cx="50" cy="35" r="14" fill="url(#goldGrad)"/>

  <!-- Mountain Peak (Himalayas) -->
  <polygon points="50,26 68,54 32,54" fill="#042f2e" opacity="0.6"/>
  <polygon points="50,26 62,54 50,54" fill="#ffffff" opacity="0.25"/>
  <polygon points="35,36 50,54 20,54" fill="#064e3b" opacity="0.8"/>
  <polygon points="65,36 80,54 50,54" fill="#064e3b" opacity="0.8"/>

  <!-- Open Book Base -->
  <path d="M 50 56 Q 30 50 18 54 L 20 74 Q 32 70 50 75 Q 68 70 80 74 L 82 54 Q 70 50 50 56 Z" fill="url(#goldGrad)" filter="url(#glow)"/>
  <path d="M 50 57 L 50 75" stroke="#042f2e" stroke-width="2" stroke-linecap="round"/>
  <path d="M 22 58 Q 33 54 48 59" stroke="#ffffff" stroke-width="1" fill="none" opacity="0.6"/>
  <path d="M 78 58 Q 67 54 52 59" stroke="#ffffff" stroke-width="1" fill="none" opacity="0.6"/>
  <path d="M 23 64 Q 34 60 48 65" stroke="#78350f" stroke-width="1" fill="none" opacity="0.5"/>
  <path d="M 77 64 Q 66 60 52 65" stroke="#78350f" stroke-width="1" fill="none" opacity="0.5"/>
</svg>
